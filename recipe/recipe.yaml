context:
  version: "5.9.0"

package:
  name: certbot-dns-rfc2136
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/certbot-dns-rfc2136/certbot_dns_rfc2136-${{ version }}.tar.gz
  sha256: 8b6443ef59ec9b338d7cafb3ac9c0add1220891fb0feddbaa57ff7bd93bedd3c

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - acme >=${{ version }}
    - certbot >=${{ version }}
    - dnspython >=2.6.1

tests:
  - python:
      imports:
        - certbot_dns_rfc2136
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://certbot.eff.org
  summary: RFC 2136 DNS Authenticator plugin for Certbot
  license: Apache-2.0
  license_file: LICENSE.txt
  documentation: https://certbot.eff.org
  repository: https://github.com/certbot/certbot

extra:
  recipe-maintainers:
    - pavelzw
